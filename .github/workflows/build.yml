name: Build VST3 (Windows x64)
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: DSP validation (headless, MSVC build)
        run: |
          cmake --build build --config Release --target mk_dsp_test
          if ($LASTEXITCODE -ne 0) { Write-Host "BUILD of mk_dsp_test FAILED"; exit $LASTEXITCODE }
          ./build/Release/mk_dsp_test.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "mk_dsp_test exited with $LASTEXITCODE (see [CHECK FAILED] lines above)"; exit $LASTEXITCODE }
      - name: Build VST3
        run: cmake --build build --config Release --target Maketeo_VST3 --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MAKETEO-VST3-Windows-x64
          path: build/Maketeo_artefacts/Release/VST3/
